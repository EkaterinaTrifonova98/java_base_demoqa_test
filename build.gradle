plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {

    testImplementation 'com.codeborne:selenide:7.3.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}